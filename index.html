<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Website Streaming Legal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">

  <style>
  body{
    background:#0a0f1a;
    color:white;
    font-family:Arial;
  }

  .container{
    display:flex;
    max-width:1000px;
    margin:auto;
    gap:20px;
    flex-wrap:wrap;
  }

  .menu{
    width:100%;
    max-width:300px;
    background:#10192b;
    padding:15px;
    border-radius:10px;
  }

  .menu h2{
    margin-bottom:10px;
  }

  .menu button{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:0;
    border-radius:8px;
    background:#1c2b45;
    color:white;
    cursor:pointer;
  }

  .menu button:hover{
    background:#27436b;
  }

  .player{
    flex:1;
    min-width:300px;
    background:#10192b;
    padding:15px;
    border-radius:10px;
  }

  iframe{
    width:100%;
    height:400px;
    border-radius:10px;
  }

  footer{
    text-align:center;
    margin-top:40px;
  }
  </style>
</head>

<body>

<header>
  <h1>🎬 Streaming Hiburan</h1>
  <p>Video resmi dari YouTube</p>
</header>

<main class="container">

  <div class="menu">
    <h2>Daftar Film</h2>

    <button onclick="play('FenvCSTsyB8')">Film 1 – Avatar</button>
    <button onclick="play('9bZkp7q19f0')">Film 2 – Action</button>
    <button onclick="play('kXYiU_JCYtU')">Film 3 – Drama</button>
    <button onclick="play('hY7m5jjJ9mM')">Film 4 – Petualangan</button>
  </div>

  <div class="player">
    <iframe id="videoPlayer"
      src="https://www.youtube.com/embed/FenvCSTsyB8"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

</main>

<section class="info">
  <h2>ℹ️ Informasi</h2>
  <p>
    Website ini menampilkan video melalui embed resmi YouTube.
    Semua hak cipta sepenuhnya milik pemilik channel.
  </p>
</section>

<footer>
  <p>© 2026 Streaming Legal | GitHub Pages</p>
</footer>

<script>
function play(id){
  document.getElementById("videoPlayer").src =
    "https://www.youtube.com/embed/" + id;
}
</script>

</body>
</html>
